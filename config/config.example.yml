  status_labels:
    - "offen"
    - "wartet_auf_user"
    - "in_arbeit"
    - "on_hold"
    - "eskaliert"
  snippets:
    entbannung:
      title: "Entbannung"
      body: "Für eine Entbannung brauchen wir bitte deinen Ingame-Namen, die Uhrzeit und den Grund."
    beschaeftigt:
      title: "Wir sind beschäftigt"
      body: "Danke für deine Nachricht! Gerade ist viel los. Wir melden uns so schnell wie möglich."
    dokumentation:
      title: "Dokumentation ansehen"
      body: "Bitte schau zuerst in die Dokumentation. Viele Fragen sind dort bereits beantwortet."

